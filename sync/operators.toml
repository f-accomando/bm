# Who takes part in the sync (written only by SPV). A new operator = a new block; nobody edits another operator's file.
# Each operator writes only its own file; the block at the top of the file (--- ... ---) is the truth for its state.
# Profile fields (place, models, subagents, strengths, weak_points) come from the "## Profilo" of each file (SYNC.md 3c); SPV copies them here.
# Write the status block with tools/sync_hdr.py. Times are ISO 8601 with a time zone; readers compare in UTC.
schema = 1

[[operator]]
id = "SPV"
name = "OP-SPV"
kind = "ai"
file = "sync/SPV.md"
branches = ["sync/protocollo-ottobre"]
place = "local, Windows 11"
models = "Sonnet 5.5 (SPV); subagent bm-planner/bm-light/bm-mechanic/bm-coder/bm-ops/bm-research"
subagents = "yes"
strengths = "planning, review, protocol"
weak_points = "does not develop; no hardware Pi/RGB30"

