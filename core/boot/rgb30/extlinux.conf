# bm on the PowKiddy RGB30: U-Boot (ROCKNIX's build, on the card before the
# partition) reads this file from the first partition of the SD card in slot
# TF1 and starts kernel8.img with booti. To update bm, replace kernel8.img.
# FDTDIR: a device tree in dtb/ is passed if there is one, U-Boot's own
# otherwise (bm does not need it).
LABEL bm
  LINUX /kernel8.img
  FDTDIR /dtb
