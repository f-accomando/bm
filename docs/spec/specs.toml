# The registry of the specification: what bm promises, by revision. The kernel says which revision it implements
# (src/bm/bm.h BM_SPEC_REV, "bmSPEC=N" in kernel.img, Settings > System); a cartridge that needs a revision says so
# with the INFO key "spec: N" (bm.info) and an older kernel refuses it with a message.
# Rule: a change that a cartridge or a tool can depend on (a format, an API function, a system key, a config key, a
# platform behaviour) gets an [[item]] here and, if it is new, a new revision. scripts/consistency.py checks this file.

[[revision]]
rev = 1
date = "2026-10-11"
what = "the baseline: container v1 (sections 1-14), resource files, projects (.bme), the .b16 marker, the 16:9 and square cartridge sizes up to 360x360, the API of docs/api as of the repository's first commit (the older history was reset on this date)"

[[revision]]
rev = 2
date = "2026-10-13"
what = "720x720 cartridges, shot() and the screenshot keys, the INFO key spec, tool names reserved against games, the .b16 flag set by every build, bm.info as the project's metadata"

[[revision]]
rev = 3
date = "2026-10-17"
what = "the cartridge type (game, app, utility) declared in bm.info and mirrored in bits 2-3 of the header flags; projects (.bme) live in /bme; /carts is obsolete (scanned for one release, with a warning)"

[[revision]]
rev = 4
date = "2026-10-22"
what = "the compatibility block in header bytes 120..127 with flag bit 4 (targets, input, aspect, needs, minimums; read and written; the menus act on the targets, see the item compat-policy), no 8 MB cartridge limit, the sound bank limit 8,388,608 values; the web API for cartridges: web_get with web_poll, web_info, web_body and web_cancel (https only, a pause per host, a size cap), image_load (JPEG, PNG, WebP into the sprite sheet), file_write (bm/web only); the config keys web_max_kib and file_write_max_kib"

