[[item]]
id = "api-cel3d"
since = 3
status = "implemented"
platforms = "all"
where = ["src/bm/runtime.c", "src/bm/r3d.c", "src/gpu/gpu3d.c", "src/gpu/version3d.h", "docs/api/light3d.md"]
note = "cel3d(), dither3d() and draw3d flags 256 and 512 (bm3D 7.4, 7.5): the sun light cut into bands in the ARM lighting stage and in the V3D lit vertex programs; flag 512 draws the outline by the inverted hull (colour and width of cel3d) on the ARM, the V3D and the Mali (the ARM path). The owner decides whether BM_SPEC_REV goes to 4 and the cart then writes spec: 4. Not measured on a Pi or an RGB30"

[[item]]
id = "web-api"
since = 4
status = "implemented"
platforms = "all"
where = ["src/bm/webget.c", "src/bm/webfile.c", "src/fs/sdlock.c", "src/bm/webpolicy.c", "src/bm/webimg.c", "src/bm/runtime.c", "src/net/http.c", "docs/api/system.md"]
note = "docs/api/system.md, section The web. Tested in QEMU for image_load, file_write and the address rules (test_web_api) and on the PC for the request itself (make test-webapi). Not tried on the Pi or the RGB30 with a real server. The folder is bm/web because the FAT writer makes 8.3 names only. A name that ends in .bmm is a model: file_write checks it as a BMRES model (bm_parse_any, kind 1, MESH) and writes /bmm/NAME.bmm, never over a file that is there, with no question to the player (make test-web-bmm on the PC; the same runtime.c on the Pi and the RGB30)"

[[item]]
id = "lowercase-names"
since = 4
status = "implemented"
platforms = "all"
where = ["src/fs/fat.c", "src/bm/project.c", "src/bm/shot.c", "src/bm/webpolicy.c", "src/kernel/reports.c", "src/kernel/sdlog.c", "src/kernel/b3dpi.c", "src/rgb30/b3d_rgb30.c", "src/script/bmui.lua", "docs/PROJECT-LAYOUT.md"]
note = "The system writes lowercase names and extensions; reads are case-insensitive. The FAT driver sets the NT lowercase flags (byte 12, 0x08 base, 0x10 extension) of the 8.3 entry; every writer builds a lowercase name (config.txt, bootlog.txt, rptNNNNN.txt, 3dNNNN.txt, shots, bmv, sav, prt, /bme/name.bme, .bm, .b16). Old files in capitals are read and replaced in place, never renamed. Tested by host test_fat (flags, lookup in any case, fsck.vfat and mtools) and the QEMU tests. Not verified on real cards in Windows, Linux and the console"

