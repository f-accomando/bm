[[item]]
id = "compat-policy"
since = 4
status = "implemented"
platforms = "all"
where = ["docs/spec/compat-policy.toml", "scripts/mkcompat.py", "src/bm/compat_table.h", "src/bm/format.c", "src/kernel/carts.c", "src/rgb30/ui.c", "src/kernel/market.c"]
note = "one table says per kernel whether a cartridge shows, greys or hides; the C table is made from it. The Pi and RGB30 menus fade the cover of a cartridge made for the other kernel (no pill, no info row) and ask before the start: the reason is the question (\"This edition is for the RGB30\"), with OK and Cancel (lib_compat_question in src/kernel/library.c; the RGB30 asks in every way to start a game, the Pi in cm_checks); the Market list fades by the file name and reads the catalog line `targets N` (catalog.c, market.c entry_grey); every start path prints the message made for the ... only (runtime.c). Proved by Pi QEMU test_market and test_grey_cart_on_pi, RGB30 QEMU test_grey_cart_and_confirm, host make test-catalog. Not verified on hardware"

