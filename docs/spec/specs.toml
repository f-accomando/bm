[[item]]
id = "api-ai-chat"
since = 6
status = "implemented"
platforms = "all"
where = ["src/bm/aichat.c", "src/bm/api_web.c", "src/bm/webget.c", "src/net/aiconf.c", "src/net/aipair.c", "docs/api/system.md"]
note = "ai_ask, ai_reply, ai_info, ai_setup, ai_pair and ai_pair_finish (docs/api/system.md, A chat model): the server, the model and the key of bm/ai.txt (src/net/aiconf.c, protected: no Lua access, refused by the network transfer; the old ai_* keys of bm/config.txt move there); the key is added by the kernel and never reaches Lua; a POST follows no redirect; the relay's CA checked against its pairing code (src/net/aipair.c) and kept in bm/ca-user.pem. Tested on the PC by make test-webapi (the JSON, the POST, the key's copy wiped), make test-https (the relay's certificate on an IP address, the POST over TLS) and make test-agent; in QEMU by test_web_api (the checks, the key not in the log). Not tried on a Pi or an RGB30 with a real provider (as divergence D50)"
