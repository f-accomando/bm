note = "one table says per kernel whether a cartridge shows, greys or hides; the C table is made from it. The Pi and RGB30 menus grey a not-compatible cartridge with a reason and ask before the start; the Market list greys by the file name. The Market reads the catalog line `targets N` (catalog.c, market.c entry_grey); every start path prints the message made for the ... only (runtime.c); the RGB30 Market lists .bm and greys them, market_bm=0 hides them. Proved 25 Oct 2026 by RGB30 QEMU test_market_bm_key and test_grey_cart_and_confirm, Pi QEMU test_market and test_grey_cart_on_pi, host make test-catalog (targets parse). RGB30 test_market_b16 fails on a step about the Installed page, not on this policy"

