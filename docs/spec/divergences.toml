# run on the hardware. Rule (docs/spec/CONSISTENCY.md): the kernels behave the same, except where a capability in
# platforms.toml really differs (cause = "hardware"). Everything else is a defect that must be gone before 1.0.0:
#   history = built at different times, the other kernel should get it; todo = documented as not done; unknown = to decide.
# `scripts/consistency.py gate` lists the open ones that block 1.0.0. status: open | suspended (kept on hold by the owner, still blocks)
# | untested (fixed in the code, compiled, not tried on the hardware: to try) | resolved (tried). Say how in `note`.
# priority (history/unknown/todo): 1 = first ... 6 = decide first whether it is wanted.

