[[key]]
name = "gpu3d"
scope = "pi"
values = "0 = the ARM draws the 3D; anything else = the V3D GPU (a game's own setting can override)"
default = "GPU"
meaning = "GPU or ARM for the 3D of the games."
settings = ""
read_in = "src/bm/runtime.c:1852"

[[key]]
name = "gpu2d_only"
scope = "pi"
values = "1 = a game with no 3D has its 2D (rectangles, sprites, map, rows) drawn by the V3D; anything else = ARM"
default = "off (0). The default is what the Pi verified: Yharnam measured on the Pi (27 Oct): no gain: without a window its 4096 x 3400 sheet is over the 2048 limit, with gpu2d_sheet the map on the GPU is slower than the ARM (44.3 fps against 50.5, docs/progress/yharnam.md)."
meaning = "The GPU draws the 2D of a game that never calls the 3D (bm3d 7.16). The job opens with the first quad; dark_begin starts it. Hidden key, no Settings row."
settings = ""
read_in = "src/bm/runtime.c:gpu2d_only_frame"

[[key]]
name = "gpu3d_light"
scope = "pi"
values = "1 = the light of dark_begin .. dark_end (fades, glow) is made by the V3D at dark_end; anything else = ARM"
default = "off (0) until the Pi measures it."
meaning = "The GPU lights the page: one quad over it multiplies each pixel by the ambient plus the lamps' colour (bm3d 7.17). The look is smooth and lamps add up; the ARM's is in levels and keeps the highest. Hidden key, no Settings row."
settings = ""
read_in = "src/bm/runtime.c:light_gpu_wanted"

[[key]]
name = "gpu3d_2d"
scope = "pi"
values = "1 = the 2D over the 3D is drawn by the GPU in its job; 0 = ARM"
default = "on (1). GPU+2D measured +6.7% and 3569+ sprites against 2574 on ARM (SYS-9b)."
meaning = "Who draws the 2D over the GPU 3D. Hidden key, no Settings row (SYS-9)."
settings = ""
read_in = "src/bm/runtime.c"

[[key]]
name = "gpu3d_aa"
scope = "pi"
values = "1 = MSAA 4x; anything else = off"
default = "off"
meaning = "Anti-aliasing of the GPU 3D. Hidden key, no Settings row; a game sets it with the second value of gpu3d(). Pi: not measured."
settings = ""
read_in = "src/bm/runtime.c:1865"

[[key]]
name = "gpu3d_attr"
scope = "pi"
values = "1 = compact vertex attributes (where the boot probe_attr passes); anything else = floats"
default = "floats (off). On the Pi Zero W the compact attributes gave no gain (herotris 54 056 against 54 013 triangles at 60 fps, 23 Oct). The Mali (RGB30) has no such path."
meaning = "Vertex attribute format of the GPU 3D. Hidden key, no Settings row (SYS-9)."
settings = ""
read_in = "src/bm/runtime.c:2029"

[[key]]
name = "gpu3d_etc1"
scope = "pi"
values = "1 = opaque textures as ETC1; anything else = off"
default = "off. Pi, 21 Oct: within 1-6% of the plain path (quad_tex 2.19 against 2.20 ns/px), no gain."
meaning = "ETC1 compression of the opaque 3D textures. Hidden key, no Settings row (SYS-9). The old Settings row set gpu3d_tex16 as well."
settings = ""
read_in = "src/bm/runtime.c:1879"

[[key]]
name = "gpu3d_filter"
scope = "pi"
values = "1 = bilinear; anything else = nearest"
default = "nearest. Bilinear changes the look and costs more per pixel (Pi: 2.3 ns/px against 1.65 nearest in a full-screen pass)."
meaning = "Texture filter of the GPU 3D."
settings = ""
read_in = "src/bm/runtime.c:1875"

[[key]]
name = "gpu3d_fs2"
scope = "pi"
values = "0 = one-thread pixel shaders; anything else = two threads"
default = "two threads (on). Pi: quad_tex 148 quads against 121 (+22%)."
meaning = "Two-thread pixel shaders of the GPU 3D. Hidden key, no Settings row (SYS-9)."
settings = ""
read_in = "src/bm/runtime.c:1881"

[[key]]
name = "gpu3d_later"
scope = "pi"
values = "1 = each frame shown a frame later (needs gpu3d_queue=2); anything else = at once"
default = "at once (off). Pi, 22 Oct: no gain (+0.9% triangles drawn, the same 6.74 sets)."
meaning = "Shows the GPU frame one frame later. Hidden key, no Settings row (SYS-9)."
settings = ""
read_in = "src/bm/runtime.c:1889"

[[key]]
name = "gpu3d_qpu"
scope = "pi"
values = "1 = the 3D Bench runs the QPU programs against the ARM versions, and the games' dark_end() (Yharnam) runs on the QPUs; anything else = off"
default = "off (no qpu_init call, no new work)"
meaning = "QPU check: a row in the 3D Bench; the darkness levels of dark_end() on the QPUs with the ARM as fallback. For the first run on the Pi."
settings = ""
read_in = "src/kernel/config.c:26"

[[key]]
name = "gpu3d_merge"
scope = "pi"
values = "0 = off; anything else = on"
default = "on (bm3d 7.6) where the vertex shader and the clipper pass the boot probe; gpu3d_merge=0 is the off switch. A run merges only from 32 pieces with at most 150 faces on average (Pi, 23 Oct: 100 pieces of 50 faces +24%, 10 of 500 -26%). The Mali (RGB30) has no merge hook and never merges."
meaning = "Draw merging: consecutive draw3d calls of meshes with baked light (or flag 2) with the same sheet that stand still, many small ones (at least 32, at most 150 faces each on average), become one mesh and one draw. Hidden key, no Settings row (SYS-9)."
settings = ""
read_in = "src/bm/runtime.c:2038"

[[key]]
name = "gpu3d_queue"
scope = "pi"
values = "0 = off, 1 = one job queued, 2 = two jobs in flight; anything else = 0 (off)"
default = "1 (on) where a V3D answers and the boot probe passes; gpu3d_queue=0 is the off switch and the fallback. The Mali (RGB30) has no queue."
meaning = "Frame queue: the game runs while the GPU draws the previous frame. Hidden key, no Settings row (SYS-9). Pi, 22 Oct: x1.75 (3.85 to 6.74 sets); queue 2 gives the same as 1."
settings = ""
read_in = "src/bm/runtime.c:2005"

[[key]]
