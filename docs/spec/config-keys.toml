values = "1 = on; anything else = off"
default = "off"
meaning = "One line a minute (seconds, mV, mA, mAh, plug, charge) in bm/bat00.csv (first free name to bat99), for the battery calibration."
settings = ""
read_in = "src/rgb30/battery.c"

