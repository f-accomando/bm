default = "1"
meaning = "Q2: a rigid lit mesh (no cel levels, no bones) is one draw: BM_VS_LIT (sun and ambient light) or BM_VS_LITX (also rim, lamps, gloss, fog) lights each face, flat. Read at every gpu3d init."
