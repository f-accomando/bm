# Registry of the keys of bm/config.txt that the kernel code reads (or writes). Facts taken from the C code.
# Date: 2026-10-13.
# Regenerate the list of names: grep -rhoE 'config_[a-z_]*\("[a-z0-9_]+"' src
#   (that finds the literal keys; also read: the keys built at run time, listed below as [[pattern]], and
#   bt_kbd/bt_mouse (+ _key) and meshy_key, whose names are in src/bt/ble.c key_addr/key_ltk and src/net/img3d.c;
#   github_api/report_repo/report_branch are read through cfg("...") in src/kernel/reports.c).
# Format of a block: scope = all | pi | rgb30 | tests (where the code reads it); values = what is accepted;
#   default = what happens when the key is missing; settings = the Settings row that edits it ("" = by hand only);
#   read_in = file:line of the read.
# Rules of the file itself (src/kernel/config.c): a key is letters, digits, "_" (max 23 chars), a value max 127;
#   a key ending in _token, _psk, _password or _key is a secret (hidden by config_list and the PC tools);
#   "key=" from the PC removes the key. Unknown keys are kept as they are.

[[key]]
name = "assist_lang"
scope = "all"
values = "it or en (fixes the assistant's language); anything else = auto"
default = "auto: follows the language of the questions, last used"
meaning = "Language of the assistant (ai_set_lang)."
settings = ""
read_in = "src/bm/runtime.c:4897"

