scope = "rgb30"
values = "1 = the Mali draws rectangles and sprites over the 3D (with mali3d=1); anything else = the ARM draws the 2D"
default = "0"
meaning = "The 2D over the 3D (gpu3d_rect2d, gpu3d_blit2d) goes into the frame of the Mali, after the 3D and without a depth test. Text, the light of dark_end and the enlarge stay on the ARM. Off by default: on the RGB30 the ARM draws the sprites faster. Read at every gpu3d init."
