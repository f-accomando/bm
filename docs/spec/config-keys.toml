default = "1"
meaning = "G2: the Mali tests depth in the tile buffer (less or equal, cleared to 1) and the backend does not sort the triangles. A frame that does not fit one pass (over 1024 draws) goes back to the sort. Read at every gpu3d init."
settings = ""
read_in = "src/rgb30/bm_port.c:38"

[[key]]
name = "mali_tex"
scope = "rgb30"
values = "0 = opaque textures stay on the ARM; anything else = the Mali draws them (with mali3d=1)"
default = "1"
meaning = "G1: the Mali draws textured faces of opaque RGB565 sheets (BM_VS_TEX and BM_FS_TEX); 0 sends them to the ARM, as before. Read at every gpu3d init."
settings = ""
read_in = "src/rgb30/bm_port.c:36"

