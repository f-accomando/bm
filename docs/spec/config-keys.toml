meaning = "A battery for the QEMU virt platform of the RGB30 (no battery there)."
settings = ""
read_in = "src/rgb30/plat_virt.c:188"

[[key]]
name = "update_url"
scope = "all"
values = "a URL or a folder of the SD card (empty counts as missing)"
default = "https://github.com/f-accomando/bm/releases"
meaning = "Where the updates are looked for."
settings = ""
read_in = "src/kernel/update.c:175"

[[key]]
name = "v3d_clock"
scope = "pi"
values = "text starting with m (max) = the GPU at the highest clock the firmware allows; anything else = untouched"
default = "the firmware's clock"
meaning = "V3D GPU clock."
settings = ""
read_in = "src/kernel/main.c:286"

[[key]]
name = "volume"
scope = "all"
values = "a number starting with a digit (atoi), limited to 0..10"
default = "10 (AUDIO_VOLUME_MAX)"
meaning = "Sound volume."
settings = "Settings > Sound > Volume"
read_in = "src/kernel/config.c:109"

[[key]]
name = "web_max_kib"
scope = "all"
values = "KB, a whole number from 1 to 32768; anything else = default"
default = "4096 (4 MB)"
meaning = "Largest answer body that web_get() keeps. A cartridge can ask for less, never more."
settings = ""
read_in = "src/bm/runtime.c:3884"

[[key]]
name = "wifi_boot"
scope = "all"
values = "0 = do not join the saved network at boot; anything else = join"
default = "join (needs wifi_ssid)"
meaning = "Connect to the saved network when the console starts."
settings = "Settings > WiFi and network > Connect at boot"
read_in = "src/net/wifi_auto.c:54"

[[key]]
name = "wifi_psk"
scope = "all"
values = "the network's password (empty or missing for an open network); secret"
default = "none"
meaning = "Password of the saved WiFi network."
settings = "Settings > WiFi and network > Connect to a network (Pi: written after a join; RGB30: by hand)"
read_in = "src/wifi/wifi.c:1092; src/rgb30/rtw_sta.c:647"

[[key]]
name = "wifi_security"
scope = "pi"
values = "UNVERIFIED (the security text of the scan result, e.g. open or WPA2; the full list is in the scan code)"
default = "WPA2 when the network is not seen in the scan"
meaning = "Security type of the saved network (written after a successful join)."
settings = "Settings > WiFi and network > Connect to a network (written)"
read_in = "src/wifi/wifi.c:1219"

[[key]]
name = "wifi_ssid"
scope = "all"
values = "the network's name (empty counts as none)"
default = "no network saved: no join"
meaning = "The saved WiFi network."
settings = "Settings > WiFi and network > Connect to a network (Pi: written after a join; RGB30: by hand)"
read_in = "src/net/wifi_auto.c:54; src/wifi/wifi.c:1092; src/rgb30/rtw_sta.c:647"

# Keys built at run time (patterns).

[[pattern]]
name = "bt_pad<N>"
scope = "all"
values = "N = 1..4 (BT_PADS); \"<address aa:bb:cc:dd:ee:ff> <32 hex digits of the link key>\""
default = "that player slot has no Bluetooth pad paired"
meaning = "Link key of the Bluetooth pad of player N; written by the pairing. The mouse's classic slot is bt_mouse_classic."
settings = "Settings > Controllers > Pair a new controller (written); Forget all controllers (removed)"
read_in = "src/bt/bt.c:189"

[[pattern]]
name = "allow_<save name>"
scope = "all"
values = "\"net=yes|no,report=yes|no,docs=yes|no\" (a part may be missing; yes if the text after the = starts with yes); the kernel adds the game title in parentheses"
default = "missing = never asked: the game stops and asks the player on the first use; the answer is saved. Not asked for the tools (tool_mode) or when the kernel has not turned the question on (bmhost, PC tests): allowed"
meaning = "Permissions given to a game: network, sending a report, documents. <save name> is the game's save name without its extension (src/bm/runtime.c perm_key). Remove the line to be asked again."
settings = ""
read_in = "src/bm/runtime.c:7695 (perm_key), 7703 (perm_get), 7816 (perm_allowed)"

[[pattern]]
name = "<game>_<anything>"
scope = "all"
values = "free text; <game> = first word of the game's title, lower case, only a-z and 0-9 kept (Overbit: overbit_bench)"
default = "cart_config(key) returns nil when missing or empty"
meaning = "Flags of one game, read and written only by the Lua cart_config(key [, value]); a key with another prefix is an error. Set from the monitor line (set overbit_bench=1080) or easy_install. `bm_screen` (`1280x720` or `640x360`; none = 1280x720 where the GPU draws) is the screen of the SDK and of the editors of the suite: every tool is `bm ...`, so they share it (`lib.layout.auto`, the Screen row of their menus)."
settings = ""
read_in = "src/bm/runtime.c:3511 (l_cart_config)"

[[key]]
name = "rec"
scope = "all"
values = "on or 1 = record every game run to /bm/rec; anything else = off"
default = "off"
meaning = "Screen recorder (VID-REC): the game's frames go to .bmv chunk files (RLE565, 15 fps); the report is printed when the game ends."
settings = "System > Screen recorder"
read_in = "src/bm/rec.c, src/kernel/settings.c"

[[key]]
name = "rec_fps"
scope = "all"
values = "1 to 30"
default = "15"
meaning = "Frames a second of the recording."
settings = ""
read_in = "src/bm/rec.c"

[[key]]
name = "rec_size"
scope = "all"
values = "WxH, 16x16 to 1920x1080 (the frame is scaled by nearest pixel)"
default = "320x180"
meaning = "Size of the recording."
settings = ""
read_in = "src/bm/rec.c"

[[key]]
name = "rec_format"
scope = "all"
values = "rle565, rgb565 or rgb332"
default = "rle565"
meaning = "Pixel format of the recording (rle565 is lossless run-length frames, rgb332 is half the raw size)."
settings = ""
read_in = "src/bm/rec.c"

[[key]]
name = "rec_ring_mb"
scope = "all"
values = "1 to 256"
default = "64 (smaller if memory is short)"
meaning = "RAM that holds the chunks that wait for the card."
settings = ""
read_in = "src/bm/rec.c"

[[key]]
name = "r3d_bands"
scope = "rgb30"
values = "0 = off; anything else, or absent = on"
default = "on with cores=4"
meaning = "The ARM raster of a mesh by bands of rows, one band a core (docs/progress/multicore.md, V1). 0 draws on core 0 only."
settings = ""
read_in = "src/rgb30/main.c:smp_boot"

[[key]]
name = "dev"
scope = "both"
values = "1 = old bridge switch; read once"
default = "absent"
meaning = "Retired. A kernel of an older build wrote dev=1; the first boot turns it into bridge=fast in bm/bridge.txt and removes the key."
settings = "Settings > System > Bridge"
read_in = "src/kernel/config.c:config_load"

[[key]]
name = "mali_par"
scope = "rgb30"
values = "0 = off; anything else, or absent = on"
default = "on with cores=4"
meaning = "The Mali draw build of a frame on all cores, a block of draws a core (docs/progress/multicore.md). 0 builds on core 0 only."
settings = ""
read_in = "src/rgb30/main.c:smp_boot"
