default = "100"
meaning = "Q2: a mesh with faces smaller than this (estimated from its radius and distance) is lit by the ARM, as many tiny faces cost more to send to the GPU than to light. Read at every gpu3d init."
settings = ""
read_in = "src/rgb30/bm_port.c:38"

[[key]]
