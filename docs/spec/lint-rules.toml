# Build lint: the Lua calls that do not suit a target. EDITABLE DATA, not code.
# One list for both tools: `scripts/mkbm.py` (the PC build) reads this file; the SDK export `bm_build_b16`
# (`src/bm/project.c`, through `bm_cart_lint`) uses the C table `src/bm/lint_table.h`, made by `scripts/mklint.py` (`--check` fails when the
# table is old; `make test-lint` runs it). Both tools skip comments and the insides of strings (`lua_code_only`
# in `mkbm.py`, `bm_lint_blank` in `src/bm/lint.c`) and print the first hit of each rule only. Warnings only: a lint
# never stops a build (docs/progress/b16.md, decision D3).
#
# [[rule]]  target   the rule list: "b16" is the list for a cartridge that runs on the RGB30 (a .b16, or a compatibility block
#                    that lists the RGB30); the name stays until the .b16 writers go (docs/design/b16-removal.md)
#           kind     how the name is found in a line of code:
#                      call         NAME(            not after a letter, digit, "_", "." or ":"
#                      call_prefix  PREFIX...(       the same, with letters, digits and "_" between PREFIX and "("
#                      word         NAME             the same, and no letter, digit or "_" after it
#                      dotted       NAME             not after a letter, digit or "_" (a field such as math.random)
#           name     the function name, the prefix or the word
#           api      true if the name is in src/ai/api.tsv (made from docs/api). `mklint.py --check` fails when it is not
#           msg      the text of the warning

[[rule]]
target = "b16"
kind = "dotted"
name = "math.random"
api = false
msg = "math.random: not the same game on every machine"

[[rule]]
target = "b16"
kind = "call"
name = "time"
api = true
msg = "time(): no clock; count the ticks instead"

[[rule]]
target = "b16"
kind = "call"
name = "save"
api = true
msg = "save(): saves are not designed yet"

[[rule]]
target = "b16"
kind = "call"
name = "ls"
api = true
msg = "ls() and files: no file system"

[[rule]]
target = "b16"
kind = "call_prefix"
name = "cart_"
api = true
msg = "cart_*: the tools' functions, not a game's"

[[rule]]
target = "b16"
kind = "call_prefix"
name = "udp_"
api = true
msg = "udp: no network from the system"

[[rule]]
target = "b16"
kind = "word"
name = "require"
api = false
msg = "require: not for a .b16"

[[rule]]
target = "b16"
kind = "call"
name = "load"
api = false
msg = "load(): not for a .b16"

[[rule]]
target = "b16"
kind = "call"
name = "screen"
api = true
msg = "screen(): one machine, one resolution"
