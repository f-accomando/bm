[[entry]]
question = "What does mget() return outside the map?"
area = "lua"
answer = "outside the map `mget` gives 0"
baseline = "python -c \"print(open('docs/api/draw.md',encoding='utf8').read())\""
recipe = "python -c \"[print(l,end='') for l in open('docs/api/draw.md',encoding='utf8') if 'mget(' in l]\""

