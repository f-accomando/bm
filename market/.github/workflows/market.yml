# The bm Market: checks the games of a pull request; on main, builds the
# catalog, signs it and publishes it with GitHub Pages
# (https://f-accomando.github.io/bm-market/). The tools are bm's
# (scripts/mkmarket.py), the public key too (keys/market-pub.pem): the
# signature is checked against it before anything is published.
name: market

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: market-${{ github.ref }}
  cancel-in-progress: false

env:
  # the branch of bm with scripts/mkmarket.py (its main branch): the
  # repository variable BM_REF, if set
  BM_REF: ${{ vars.BM_REF || 'bm-core' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: f-accomando/bm
          ref: ${{ env.BM_REF }}
          path: bm
          sparse-checkout: |
            scripts
            keys
      - name: Check the games
        run: python3 bm/scripts/mkmarket.py games --check

  publish:
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: f-accomando/bm
          ref: ${{ env.BM_REF }}
          path: bm
          sparse-checkout: |
            scripts
            keys
      # until the key is set up (README.md, "Setting it up") the games are
      # checked but nothing is published: a warning, not a failure
      - name: The key
        id: key
        env:
          BM_MARKET_KEY: ${{ secrets.BM_MARKET_KEY }}
        run: |
          if [ -z "$BM_MARKET_KEY" ]; then
            echo "::warning::no secret BM_MARKET_KEY yet: the catalog is not published (README.md, Setting it up)"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          elif ! grep -q "BEGIN PUBLIC KEY" bm/keys/market-pub.pem; then
            echo "::warning::bm ($BM_REF) has no keys/market-pub.pem yet: the catalog is not published"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Build and sign the catalog
        if: steps.key.outputs.ok == 'true'
        env:
          BM_MARKET_KEY: ${{ secrets.BM_MARKET_KEY }}
        run: python3 bm/scripts/mkmarket.py games -o site --require-key --pub bm/keys/market-pub.pem
      - uses: actions/upload-pages-artifact@v5
        if: steps.key.outputs.ok == 'true'
        with:
          path: site
      - id: deploy
        if: steps.key.outputs.ok == 'true'
        uses: actions/deploy-pages@v5
