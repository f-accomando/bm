name: ci

on:
  push:
    # the consoles' test reports (src/kernel/reports.c) are not code
    branches-ignore: [reports]
    # with a branch filter alone GitHub skips the tags: the releases (v*,
    # the release job below) need them named
    tags: ['v*']
  pull_request:

env:
  # The Pi Zero 2 W's build (kernel7.img) and its tests are off for now:
  # "1" turns them on again (make reads ZERO2 from the environment).
  ZERO2: "0"

jobs:
  # A tag on a commit whose tests already passed on a branch (bm-core, before
  # the tag): the release goes at once, the tests are not run again.
  tested:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      actions: read
    outputs:
      tested: ${{ steps.find.outputs.tested }}
    steps:
      - id: find
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # this workflow's successful push runs of the same commit, not those
          # of a tag (head_branch v...); an API error means "not tested"
          n=$(gh api -X GET "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" \
                -f head_sha="$GITHUB_SHA" -f event=push -f status=success \
                --jq '[.workflow_runs[] | select(.head_branch | test("^v[0-9]") | not)] | length' || echo 0)
          echo "successful runs of $GITHUB_SHA on a branch: $n"
          echo "tested=$([ "${n:-0}" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  # The tests on the PC (make test-host), on two machines: Overbit's take
  # half the time (5 min), the others the other half.
  host:
    needs: tested
    if: ${{ !cancelled() && needs.tested.outputs.tested != 'true' }}
    name: host (${{ matrix.part }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - part: overbit
            make: test-overbit
          - part: the others
            make: test-host HOST_SKIP=test-overbit
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install toolchain and QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-arm-none-eabi libnewlib-arm-none-eabi binutils-arm-none-eabi \
            qemu-system-arm qemu-user make python3 python3-numpy python3-pil dosfstools mtools

      - name: Build
        run: make -j"$(nproc)"

      - name: Tests on the PC
        run: make ${{ matrix.make }}

  # The tests in QEMU (make test-qemu), in four groups of about 6 minutes on
  # four machines at once (tests/qemu_test.py --shard).
  qemu:
    needs: tested
    if: ${{ !cancelled() && needs.tested.outputs.tested != 'true' }}
    name: qemu (${{ matrix.shard }}/4)
    # Pinned: the screen reference hash depends on the QEMU version (8.2 here).
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install toolchain and QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-arm-none-eabi libnewlib-arm-none-eabi binutils-arm-none-eabi \
            qemu-system-arm qemu-user make python3 python3-numpy python3-pil dosfstools mtools

      - name: Build
        run: make -j"$(nproc)"

      - name: Build the stress kernel
        if: matrix.shard == 1
        run: make -j"$(nproc)" BOOT=stress

      - name: QEMU tests
        run: make test-qemu SHARD=${{ matrix.shard }}/4

      - name: QEMU tests of kernel7.img (Pi Zero 2 W, in raspi2b)
        if: env.ZERO2 == '1'
        run: make test-zero2 SHARD=${{ matrix.shard }}/4

      - name: Screenshot
        if: always() && matrix.shard == 1
        run: make qemu-screenshot || true

      - uses: actions/upload-artifact@v6
        if: always() && matrix.shard == 1
        with:
          name: bm-images
          path: |
            build/kernel.img
            build/kernel7.img
            build/chainloader.img
            build-stress/kernel.img
            build/screen.png
          if-no-files-found: ignore

  rgb30:
    # bm for the PowKiddy RGB30 (RK3566, AArch64): the console's kernel, and
    # the same kernel for QEMU's virt machine with its tests (rgb30.mk)
    needs: tested
    if: ${{ !cancelled() && needs.tested.outputs.tested != 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install toolchain and QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu picolibc-aarch64-linux-gnu \
            qemu-system-arm make python3 dosfstools mtools

      - name: Build
        run: make TARGET=rgb30 -j"$(nproc)"

      - name: QEMU tests
        run: make TARGET=rgb30 test

  release:
    # A tag v* whose tests passed (M19): the kernels, the games and bm/ca.pem
    # on a GitHub release, with manifest.txt signed by the secret
    # BM_RELEASE_KEY (scripts/release-key.sh). The Pi checks the signature
    # with keys/release-pub.pem, built into the kernel, and each file's
    # SHA-256 before installing it. All the tests passed here, or on a
    # branch before the tag (the job tested).
    needs: [tested, host, qemu, rgb30]
    if: >-
      ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v') &&
      (needs.tested.outputs.tested == 'true' ||
      (needs.host.result == 'success' && needs.qemu.result == 'success' && needs.rgb30.result == 'success')) }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Install toolchain
        # numpy and Pillow: the games' assets (Overbit's map) are built too;
        # the AArch64 compiler: the RGB30's kernel8.img
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-arm-none-eabi libnewlib-arm-none-eabi binutils-arm-none-eabi make python3 \
            python3-numpy python3-pil gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            picolibc-aarch64-linux-gnu

      - name: Build and sign
        env:
          BM_RELEASE_KEY: ${{ secrets.BM_RELEASE_KEY }}
        # the kernels say the tag as their version: the consoles compare it
        run: |
          make TARGET=rgb30 -j"$(nproc)" VERSION="$GITHUB_REF_NAME"
          make -j"$(nproc)" release VERSION="$GITHUB_REF_NAME" RELEASE_FLAGS=--require-key \
            RGB30_KERNEL=build/rgb30/kernel8.img

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/release/* --verify-tag \
            --title "bm $GITHUB_REF_NAME" --generate-notes \
            --notes "Kernel (kernel.img; kernel7.img per il Pi Zero 2 W, se c'è; kernel8.img per la RGB30), giochi e bm/ca.pem. manifest.txt (Pi) e manifest-rgb30.txt (RGB30) dicono dove va ogni file sulla SD, la dimensione e lo SHA-256; i .sig sono le loro firme (ECDSA P-256), controllate dalla console con la chiave nel kernel. A mano: python3 tools/bm_net.py IP --kernel kernel.img (kernel7.img sul Zero 2 W, kernel8.img sulla RGB30)"
